name: Android CI Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: debug-apk
        path: |
          org.eclipse.paho.android.service/build/outputs/apk/org.eclipse.paho.android.service-debug.apk
          org.eclipse.paho.android.sample/build/outputs/apk/org.eclipse.paho.android.sample-debug.apk
          paho.mqtt.android.example/build/outputs/apk/paho.mqtt.android.example-debug.apk
        retention-days: 5

    - name: List generated APKs
      run: |
        echo "Generated APK files:"
        find . -name "*.apk" -type f 2>/dev/null